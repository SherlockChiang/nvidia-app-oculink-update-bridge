name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Restore
        shell: pwsh
        run: dotnet restore .\NvidiaAppOculinkShim.slnx

      - name: Verify formatting
        shell: pwsh
        run: >-
          dotnet format .\NvidiaAppOculinkShim.slnx
          --verify-no-changes --no-restore

      - name: Build
        shell: pwsh
        run: >-
          dotnet build .\NvidiaAppOculinkShim.slnx
          --configuration Release --no-restore

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $failures = [Collections.Generic.List[string]]::new()
          git ls-files -- '*.ps1' '*.psm1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $_,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            foreach ($error in $errors) {
              $failures.Add("${_}: $($error.Message)")
            }
          }
          if ($failures.Count -gt 0) {
            throw ($failures -join "`n")
          }

      - name: Run deterministic self-test
        shell: pwsh
        run: |
          dotnet run `
            --project .\src\NvidiaAppOculinkShim\NvidiaAppOculinkShim.csproj `
            --configuration Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Self-test failed.' }
          .\tests\Invoke-LauncherSelfTest.ps1
          .\tests\Test-ReleaseVersion.ps1

      - name: Build and validate unsigned test package
        shell: pwsh
        run: |
          $version = "4.0.0-ci.$env:GITHUB_RUN_NUMBER"
          .\build\Publish-Package.ps1 -Version $version
          $name = "NvidiaAppOculinkUpdateBridge-$version-win-x64"
          .\tests\Test-Package.ps1 `
            -PackagePath ".\artifacts\package\$name" `
            -ArchivePath ".\artifacts\$name.zip"
          .\build\Publish-Package.ps1 `
            -Version $version -SkipBuild -IncludeInstallerBatchFiles
          .\tests\Test-Package.ps1 `
            -PackagePath ".\artifacts\package\$name" `
            -ArchivePath ".\artifacts\$name.zip" `
            -ExpectInstallerBatchFiles
          .\tests\Test-InstallerBatchPackageMode.ps1 `
            -PackagePath ".\artifacts\package\$name" `
            -ArchivePath ".\artifacts\$name.zip"
          # Leave the uploaded CI artifact in the stricter launcher-only mode.
          .\build\Publish-Package.ps1 -Version $version -SkipBuild
          .\tests\Test-Package.ps1 `
            -PackagePath ".\artifacts\package\$name" `
            -ArchivePath ".\artifacts\$name.zip"

      - name: Exercise package-signing gate with an ephemeral certificate
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        timeout-minutes: 40
        run: .\tests\Invoke-SigningPipelineTest.ps1

      - name: Upload test package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-win-x64-${{ github.run_number }}
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  live-integration:
    name: Live NVIDIA metadata integration
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Build
        shell: pwsh
        run: >-
          dotnet build .\NvidiaAppOculinkShim.slnx
          --configuration Release

      - name: Exercise live NVIDIA metadata flow
        shell: pwsh
        run: .\tests\Invoke-IntegrationTest.ps1 -Configuration Release
